# Insert the compatibility plugin into any profile:
#   dsh --profile web --patch ./packages/context/claude-compat/example-overlay.yml
#
# `name` is an absolute source path because this package is unpublished and its
# peer dependencies are `workspace:*`, which a profile install cannot resolve.
# Once published, the package name works instead.
- insert:
    - id: claude-compat
      name: '/Users/chaos/.local/share/chaos-harness/packages/context/claude-compat/src/index.ts'
      config:
        roots:
          - '~/.agents/pstack-plugin'
        provider: spawn
        hooks: true
        # Child LLM routes. Unlisted types inherit the parent route; "*" pins
        # every type without an exact entry. Most providers advertise `high`.
        # models:
        #   '*': { provider: local, model: glm-5.3, reasoningEffort: high }
        #   'pstack:comment-sicko': { provider: local, model: glm-5.3, reasoningEffort: high }
        # Model-only aliases; replace these example routes with your providers.
        modelAliases:
          opus: { provider: local, model: glm-5.3, reasoningEffort: high }
          sonnet: { provider: local, model: deepseek-v4.1-flash }
        # Native context is opt-in and reads only this sheet (never rewrites it).
        # pstack:
        #   root: '~/.agents/pstack-plugin'
        #   sheetPath: '/absolute/path/to/pstack-models.md'
        modelSelection: false
